<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<link rel="canonical" href="{{ canonical }}">
<link rel="alternate" type="application/rss+xml" title="{{ title }}" href="{{ url }}/feed.xml">
<link rel="stylesheet" href="{{ url }}/static/style.css">
<link rel="stylesheet" href="{{ url }}/static/highlight.css">
{{ head }}
</head>
<body>
<header class="site">
  <a class="home" href="{{ url }}/">{{ title }}</a>
  <nav>
    <a href="{{ url }}/about/">about</a>
    <a href="{{ url }}/feed.xml">rss</a>
  </nav>
</header>
<main>
{{ body }}
</main>
<footer class="site">
  <span>© {{ year }} {{ author }}</span> · <span>{{ tagline }}</span>
</footer>
</body>
</html>
